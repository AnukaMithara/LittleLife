name: Check LittleLife
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: test-results/
          retention-days: 7
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            label: macos-x64
            target: x86_64-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Clear cached installers
        run: python -c "import shutil; shutil.rmtree('src-tauri/target/${{ matrix.target }}/release/bundle', ignore_errors=True)"
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib
      - run: python scripts/package_test_build.py --target ${{ matrix.target }} --label ${{ matrix.label }} --bundle ${{ matrix.bundle }} --commit ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: LittleLife-test-${{ matrix.label }}
          path: dist-test/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 14
