[package]
name = "littlelife"
version = "0.1.0"
description = "A little company for your everyday"
authors = ["Anuka Mithara"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "littlelife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
